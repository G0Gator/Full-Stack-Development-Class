<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 4 Exercise - Javascript Sampling</title>

    <link rel="stylesheet" href="exercise.css">
    <script src="exercise.js"></script>
</head>
<body>
    <h1>Web Service API Consumer Example</h1>
    <div class="myflexboxRow">
        <div class="myflexboxColumn">
            <h2>Obtain user information</h2>
            <label for="newParagraphs">How many paragraphs?</label>
            <select id="newParagraphs">
                <option value=1>1</option>
                <option value=2>2</option>
                <option value=3>3</option>
                <option value=4>4</option>
                <option value=5>5</option>
            </select><br /><br />
            <input type="button" value="Get my Bacon Ipsum!" onclick="getBaconipsum()">
        </div>
        <div class="myflexboxColumn">
            <h2>Returned data in raw JSON</h2>
            <div id="myRawData"></div>
        </div>
        <div class="myflexboxColumn">
            <h2>Returned data as formatted paragraphs</h2>
            <div id="myFormattedData"></div>
        </div>
        <div class="myflexboxColumn">
            <h2>Returned data — Caesar cipher</h2>
            <label for="shiftAmount">Shift:</label>
            <select id="shiftAmount">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
                <option value="20">20</option>
                <option value="21">21</option>
                <option value="22">22</option>
                <option value="23">23</option>
                <option value="24">24</option>
                <option value="25">25</option>
            </select>
            <div id="myCipherData"></div>
        </div>
    </div>    
</body>
</html>
