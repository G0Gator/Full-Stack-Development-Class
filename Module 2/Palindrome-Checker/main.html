<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <script src="main.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Palindrome Checker Application</span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">Check if a Word is a Palindrome</h1>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">Input Form</h5>
                    </div>
                    <div class="card-body">
                        <form id="palindromeForm">
                            <div class="mb-3">
                                <label for="wordInput" class="form-label">Enter a Word:</label>
                                <input type="text" class="form-control" id="wordInput" placeholder="e.g., racecar">
                            </div>

                            <div class="mb-3">
                                <label for="algorithmSelect" class="form-label">Select Algorithm:</label>
                                <select class="form-select" id="algorithmSelect">
                                    <option value="">-- Choose an Algorithm --</option>
                                    <option value="1">Algorithm 1: Two Pointer Approach</option>
                                    <option value="2">Algorithm 2: String Reversal</option>
                                    <option value="3">Algorithm 3: Recursive Method</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="caseSensitive" class="form-label">Case Sensitivity:</label>
                                <div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="caseSensitive" id="caseInsensitive" value="false" checked>
                                        <label class="form-check-label" for="caseInsensitive">
                                            Case Insensitive
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="caseSensitive" id="caseSensitiveYes" value="true">
                                        <label class="form-check-label" for="caseSensitiveYes">
                                            Case Sensitive
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <button type="button" class="btn btn-primary w-100" onclick="checkPalindrome()">Check Palindrome</button>
                        </form>

                        <div id="errorMessages" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="card-title mb-0">Analysis</h5>
                    </div>
                    <div class="card-body">
                        <div id="analysisData">
                            <p class="text-muted">Results will appear here after checking...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="card-title mb-0">Palindromes Found</h5>
                    </div>
                    <div class="card-body">
                        <ul id="palindromeList" class="list-group">
                            <li class="list-group-item text-muted">No palindromes checked yet</li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="card-title mb-0">Not Palindromes</h5>
                    </div>
                    <div class="card-body">
                        <ul id="notPalindromeList" class="list-group">
                            <li class="list-group-item text-muted">No non-palindromes checked yet</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
