<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="hello-world-ai.css" />
  </head>
  <body>
    <main class="card">
      <p class="badge">AI Demo</p>
      <h1>Hello, World</h1>
      <p class="subtitle">Enter your name and say hello.</p>

      <label for="name-input">Your Name</label>
      <div class="input-row">
        <input id="name-input" type="text" placeholder="Type your name" />
        <button id="greet-btn" type="button">Enter</button>
      </div>

      <p id="greeting" class="greeting">Hello there!</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
